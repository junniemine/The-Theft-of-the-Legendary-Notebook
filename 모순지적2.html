<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="stylesheet" href="/src/style.css">
    <title>Title</title>
</head>
<style>
        @import url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2206-02@1.0/ChosunCentennial.woff2');
        body{
            font-family: 'ChosunCentennial',sans-serif;
            color: #1c1c1c;
            padding: 1rem;
            line-height: 1.5;
            }
             .sentence {
            font-size: 1.0rem;
            line-height: 2;
            margin-bottom: 2rem;
            font-family: 'Galmuri14';
            text-align: center;
        }
        .blank {
            display: inline-block;
            width: 70px;
            border-bottom: 2px solid #989898;
            margin: 0 5px;
        
        }
        .word-choices {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            border-top: 1px solid #ccc;
            padding-top: 1.5rem;
        }
        .word-switch {
            display: none;
        }
        .word-label {
            padding: 5px 15px;
            border-radius: 3px;
            cursor: pointer;
            transition: all 0.2s ease;
            border: 1px solid black;
            font-family: 'Galmuri14';
            font-size: 13px;
        }
        .word-switch:checked + .word-label {
            opacity: 0.5;
            cursor: not-allowed;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.3);
        }
        .next-page-link {
            display: none;
            margin-top: 2rem;
            text-align: center;
        }
        .next-page-link a {
            font-size: 0.9rem;
            color: #030303;
            text-decoration: none;
            font-family: 'Galmuri14';
        }
            #word-lock:checked ~ #word-conan:checked ~ #word-loud:checked ~ .next-page-link {
            display: block;
        }
        
</style>
<body>
<body> 
    <h2>[이시헌의 반론] </h2>

<p>이시헌: 금고가 고장났다는 사실, 선배 말대로 정말 몰랐어요. 하지만 아침에 비밀번호를 친 이유는 금고 문이 닫혀 있으니까 친 거뿐이예요.
    노트를 넣고 바로 나왔기 때문에 <b>문이 안 잠긴 줄</b> 몰랐어요.
</p>

     <p>"그래? 근데 금고의 특성을 생각하면 잠긴줄 몰랐다는 건 말이 안 되는데..</p>

        <p id = "ask">과거 송지우가 한 말을 회상해보자!(순서대로 클릭)</p>

         <div class="puzzle-container">
        <div class="sentence">
            문을 <span class="blank"></span> 나면 <span class="blank"></span>를 아주 <span class="blank"></span> 들려주거든
    
        <input type="checkbox" id="word-lock" class="word-switch">
        <input type="checkbox" id="word-conan" class="word-switch">
        <input type="checkbox" id="word-loud" class="word-switch">
        <input type="checkbox" id="word-quiet" class="word-switch">
        <input type="checkbox" id="word-open" class="word-switch">
    
        <div class="word-choices">
            <label for="word-quiet" class="word-label">작게</label>
            <label for="word-conan" class="word-label">코난 ost</label>
            <label for="word-loud" class="word-label">크게</label>
            <label for="word-lock" class="word-label">잠그고</label>
            <label for="word-open" class="word-label">열고</label>
          
        </div>

    
        <div class="next-page-link">
            <a href="모순지적3.html">▼ 반박하기</a>
        </div>
    </div>

    


        
    <script type="module" src="/src/main.js"></script>
</body>

</html>
